name: 功能请求
description: 提出一个新功能或改进建议
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，再说方案。由 AI 生成或 AI 辅助生成的内容必须声明，
        规范见 [CONTRIBUTING.md](https://github.com/ouyangjiahong26/bibtex-clean/blob/main/CONTRIBUTING.md)。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 现在哪里不好用？在什么场景下遇到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望插件怎么做？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过但没选的方案，以及为什么不选。
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        内容由 AI 生成或 AI 辅助生成时，标题最开头加 `[AI Generated] ` 并加上 `ai-generated` 标签，
        规范见 [CONTRIBUTING.md](https://github.com/ouyangjiahong26/bibtex-clean/blob/main/CONTRIBUTING.md)。
