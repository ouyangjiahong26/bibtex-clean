<vbox id="bibtex-clean-preferences">
  <linkset>
    <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  </linkset>

  <groupbox>
    <label
      ><html:h2 data-l10n-id="preferences-delete-title"
        >筛选删除</html:h2
      ></label
    >
    <description data-l10n-id="preferences-delete-description"
      >筛选删除附件与笔记会把选中的子条目移入回收站，删除时按下面的并发数分批执行。删除不提供插件内撤销，恢复入口是
      Zotero 回收站。</description
    >
    <hbox align="center">
      <label
        data-l10n-id="preferences-delete-concurrency"
        control="bibtex-clean-delete-concurrency"
        >删除并行数量</label
      >
      <html:input
        id="bibtex-clean-delete-concurrency"
        type="number"
        min="1"
        max="20"
        preference="deleteConcurrency"
      />
      <description data-l10n-id="preferences-delete-concurrency-hint"
        >1 表示逐个删除；数值越大越快，但写入越集中。</description
      >
    </hbox>
  </groupbox>
</vbox>
